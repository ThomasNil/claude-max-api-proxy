services:
  claude-max-api-proxy:
    build: .
    container_name: claude-max-api-proxy
    restart: unless-stopped

    environment:
      - HOST=0.0.0.0

    ports:
      - "3456:3456"

    volumes:
      # Whole home dir, not just ~/.claude/ - the CLI's main config file
      # (~/.claude.json) lives one level up from that directory.
      - claude-config:/home/claudeuser

    networks:
      - edge

networks:
  edge:
    external: true

volumes:
  claude-config:
